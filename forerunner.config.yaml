# forerunner.config.yaml — dogfood config for the codeforerunner repo itself.
# Enables drift rules that are relevant to this project's surface area.
# R6/R6b/R6-no-docker/R6b-no-makefile intentionally excluded (no Docker or Makefile here).

tasks:
  check:
    enabled_rules:
      - R1-no-cli
      - R2-no-pre-commit
      - R3-no-ci
      - R4-no-installer
      - R5-no-python-package
      - R7-no-mcp
      - R8-no-marketplace
    ignore_paths: []
