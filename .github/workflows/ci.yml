name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Reject iCloud sync-conflict files
        # iCloud Drive appends " 2", " 3", … to filenames on a sync conflict.
        # These must never be committed; fail the build if any are tracked.
        run: |
          matches="$(git ls-files | grep -E ' [0-9]+(\.[^/]+)?$' || true)"
          if [ -n "$matches" ]; then
            echo "::error::iCloud sync-conflict files are tracked in git:"
            echo "$matches"
            exit 1
          fi
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "20"
      - name: Install package
        run: python -m pip install -e . pytest
      - name: Run Node installer tests
        run: npm test
      - name: Run tests
        # Node must be on PATH first: the slug-parity test shells out to it.
        run: pytest -q

  # Smoke-tests the composite action's own wiring (#108). The action installs the
  # released CLI from PyPI, so this exercises action.yml against a real forerunner.
  # Neither step can read the CLI's exit code, but the pair pins it: a failure to
  # run (exit 2) fails the ungated step too, so only exit 1 satisfies both.
  action-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Drift is ignored when fail-on-drift is false
        uses: ./
        with:
          repo: tests/fixtures/drifting-repo
          fail-on-drift: "false"

      - name: Drift fails the job when fail-on-drift is true
        id: gated
        continue-on-error: true
        uses: ./
        with:
          repo: tests/fixtures/drifting-repo
          fail-on-drift: "true"

      - name: Assert the gated run failed
        run: |
          if [ "${{ steps.gated.outcome }}" != "failure" ]; then
            echo "::error::expected the gated action run to fail on the drifting fixture, got '${{ steps.gated.outcome }}'"
            exit 1
          fi
