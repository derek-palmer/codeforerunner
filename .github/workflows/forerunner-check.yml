# SPEC.md §D.hooks — CI mirror of pre-commit `forerunner check`.
# forerunner check exits 0 when forerunner.config.yaml is absent, so no job-level gate needed.
name: forerunner check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Reserved (D.hooks env): optional model override; not consumed yet.
      FORERUNNER_MODEL: ${{ vars.FORERUNNER_MODEL || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Check version consistency
        run: python scripts/check_versions.py
      - run: forerunner check
