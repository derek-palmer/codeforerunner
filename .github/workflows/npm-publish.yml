name: npm-publish

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/codeforerunner
    permissions:
      id-token: write   # required for OIDC trusted publishing (tokenless)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # npm OIDC trusted publishing requires Node >= 22.14.0
          registry-url: "https://registry.npmjs.org"
      - name: Verify tag matches package.json version
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="$(node -e "process.stdout.write(require('./package.json').version)")"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "tag ($TAG) does not match package.json version ($PKG_VERSION)" >&2
            exit 1
          fi
      - name: Publish to npm
        run: npm publish --provenance --access public
