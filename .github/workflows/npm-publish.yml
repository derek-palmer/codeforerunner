name: npm-publish

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/codeforerunner
    permissions:
      contents: read
      id-token: write   # required for OIDC trusted publishing (tokenless)
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm for OIDC trusted publishing
        # OIDC trusted publishing needs npm >= 11.5.1; Node 22 still bundles
        # npm 10.x, which silently falls back to anonymous publish and 404s.
        run: npm install -g npm@latest
      - name: Verify tag matches package.json version
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION="$(node -e "process.stdout.write(require('./package.json').version)")"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "tag ($TAG) does not match package.json version ($PKG_VERSION)" >&2
            exit 1
          fi
      - name: Publish to npm
        run: npm publish --provenance --access public

  publish-gpr:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@derek-palmer"
      - name: Scope package name for GitHub Packages
        run: npm pkg set name="@derek-palmer/codeforerunner"
      - name: Verify scoped name and tag/version parity
        # Guard against a failed/partial rename or a tag/version mismatch
        # shipping a mislabeled scoped package.
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/v}"
          NAME="$(node -e "process.stdout.write(require('./package.json').name)")"
          VERSION="$(node -e "process.stdout.write(require('./package.json').version)")"
          if [ "$NAME" != "@derek-palmer/codeforerunner" ]; then
            echo "scoped name not applied: got '$NAME'" >&2
            exit 1
          fi
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag ($TAG) does not match package.json version ($VERSION)" >&2
            exit 1
          fi
      - name: Publish to GitHub Packages
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
