name: "CodeForerunner Doc Check"
description: "Detect documentation drift — finds docs that contradict actual repo state. No-op without forerunner.config.yaml."
author: "derek-palmer"

branding:
  icon: "book-open"
  color: "blue"

inputs:
  python-version:
    description: "Python version to use"
    required: false
    default: "3.11"
  version:
    description: "codeforerunner version to install (default: latest)"
    required: false
    default: "latest"
  repo:
    description: "Path to the repository to check"
    required: false
    default: ${{ github.workspace }}
  fail-on-drift:
    description: "Exit non-zero if drift is detected"
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6.2.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install codeforerunner
      shell: bash
      run: |
        if [ "${{ inputs.version }}" = "latest" ]; then
          pip install codeforerunner
        else
          pip install "codeforerunner==${{ inputs.version }}"
        fi

    - name: Run forerunner check
      shell: bash
      run: |
        # `--repo` must precede the subcommand: it is a top-level flag (#108).
        rc=0
        forerunner --repo "${{ inputs.repo }}" check || rc=$?
        # Exit 1 means drift was found; anything else means the check failed to
        # run (e.g. 2 = bad args or invalid config) and must never be swallowed.
        if [ "$rc" -eq 1 ] && [ "${{ inputs.fail-on-drift }}" != "true" ]; then
          echo "::warning::documentation drift detected (fail-on-drift=false)"
          rc=0
        fi
        exit "$rc"
