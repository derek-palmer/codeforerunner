[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeforerunner"
version = "0.4.1"
description = "Model-agnostic repository documentation tooling (prompt-first; thin CLI)."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Codeforerunner-SAL-0.1"
license-files = ["LICENSE.md"]
authors = [{ name = "Derek Palmer" }]
keywords = [
  "repository-documentation",
  "developer-tools",
  "agent-tooling",
  "code-generation",
  "prompt-engineering",
  "mcp",
  "llm",
  "documentation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Documentation",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]
dependencies = [
  "PyYAML>=6.0",
]

[project.urls]
Repository = "https://github.com/derek-palmer/codeforerunner"
Issues = "https://github.com/derek-palmer/codeforerunner/issues"

[project.scripts]
forerunner = "codeforerunner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codeforerunner = ["py.typed", "prompts/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
