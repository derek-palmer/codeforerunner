[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "codeforerunner"
version = "0.1.0"
description = "Model-agnostic repository documentation tooling."
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Codeforerunner-SAL-0.1"
license-files = ["LICENSE.md"]
dependencies = [
    "PyYAML>=6.0,<7.0",
]

[project.urls]
Repository = "https://github.com/derek-palmer/codeforerunner"
Issues = "https://github.com/derek-palmer/codeforerunner/issues"

[project.scripts]
forerunner = "codeforerunner.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0,<10.0",
    "ruff>=0.11,<1.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
